name: Build aster-core

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"

  pull_request:

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            nasm \
            binutils \
            qemu-system-x86 \
            mtools

      - name: Build aster-core
        run: make

      - name: Upload floppy image
        uses: actions/upload-artifact@v4
        with:
          name: asteros-image
          path: |
            build/aster.img
            build/kernel.elf
            build/kernel.bin
